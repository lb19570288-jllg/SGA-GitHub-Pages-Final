<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="description" content="Cartelera visual de actividades ambientales del SGA del ITAO.">
    <title>Cartelera | SGA ITAO</title>

    <style>
        /* ------------------------------------------------------------
           CARTELERA FLEXIBLE - Todo el CSS es legible y no minificado.

           Las fotos no se convierten en fondos ni se recortan.
           Se muestran completas, conservando sus proporciones.
           Las fotos verticales se amplían; las horizontales quedan igual.
           ------------------------------------------------------------ */

        :root {
            color-scheme: light;
            font-family: "Noto Sans", Arial, sans-serif;
            --sga-azul: #1b396a;
            --sga-borde: rgba(27, 57, 106, 0.13);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: transparent;
        }

        button,
        a {
            font: inherit;
        }

        [hidden] {
            display: none !important;
        }

        .cartelera {
            width: 100%;
            margin: 0 auto;
            padding: clamp(12px, 2vw, 24px);
            border: 1px solid var(--sga-borde);
            border-radius: 22px;
            background: linear-gradient(
                135deg,
                rgba(238, 246, 252, 0.81),
                rgba(246, 250, 253, 0.64)
            );
            -webkit-backdrop-filter: blur(14px);
            backdrop-filter: blur(14px);
            color: var(--sga-azul);
            box-shadow: 0 16px 35px rgba(27, 57, 106, 0.06);
        }

        /* La foto vertical gana espacio, sin distorsionarse ni recortarse. */
        .cartelera--vertical {
            max-width: 820px;
        }

        .cartelera__imagen-enlace {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            text-decoration: none;
            cursor: zoom-in;
        }

        .cartelera__foto {
            display: block;
            width: auto;
            height: auto;
            max-width: 100%;
            max-height: 620px;
            object-fit: contain;
            border-radius: 14px;
            box-shadow: 0 7px 20px rgba(0, 0, 0, 0.10);
            opacity: 0;
            transition: opacity 300ms ease, max-height 450ms ease;
        }

        .cartelera__foto--visible {
            opacity: 1;
        }

        .cartelera--vertical .cartelera__foto {
            max-height: 760px;
        }

        .cartelera__imagen-enlace:focus-visible,
        .cartelera__abrir-original:focus-visible,
        .cartelera__boton:focus-visible,
        .cartelera__punto:focus-visible {
            outline: 3px solid #17886c;
            outline-offset: 4px;
        }

        .cartelera__pie {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-top: 16px;
            color: var(--sga-azul);
        }

        .cartelera__abrir-original {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            color: var(--sga-azul);
            font-size: 0.87rem;
            font-weight: 700;
            text-underline-offset: 3px;
        }

        .cartelera__controles {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: flex-end;
            gap: 13px;
        }

        .cartelera__botonera,
        .cartelera__paginacion {
            display: inline-flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 7px;
        }

        .cartelera__boton {
            display: inline-grid;
            place-items: center;
            width: 36px;
            height: 36px;
            padding: 0;
            border: 1px solid rgba(27, 57, 106, 0.20);
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.68);
            color: var(--sga-azul);
            font-size: 1.3rem;
            cursor: pointer;
        }

        .cartelera__boton:hover {
            background: #ffffff;
        }

        .cartelera__punto {
            width: 9px;
            height: 9px;
            padding: 0;
            border: 0;
            border-radius: 50%;
            background: rgba(27, 57, 106, 0.32);
            cursor: pointer;
        }

        .cartelera__punto[aria-current="true"] {
            width: 22px;
            border-radius: 999px;
            background: var(--sga-azul);
        }

        .cartelera__contador {
            font-size: 0.82rem;
            font-variant-numeric: tabular-nums;
        }

        .cartelera__vacio {
            display: grid;
            min-height: 200px;
            place-items: center;
            margin: 0;
            color: var(--sga-azul);
            font-size: clamp(1.3rem, 3vw, 1.8rem);
            font-weight: 700;
            text-align: center;
        }

        @media (max-width: 600px) {
            .cartelera {
                padding: 12px;
                border-radius: 17px;
            }

            .cartelera__foto {
                max-height: 440px;
                border-radius: 10px;
            }

            .cartelera--vertical .cartelera__foto {
                max-height: 680px;
            }

            .cartelera__pie {
                flex-direction: column;
                align-items: center;
                gap: 14px;
                margin-top: 14px;
            }

            .cartelera__controles {
                justify-content: center;
            }

            .cartelera__vacio {
                min-height: 180px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                transition-duration: 0.01ms !important;
                animation-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <main
        id="cartelera"
        class="cartelera"
        aria-label="Cartelera de imágenes del Sistema de Gestión Ambiental"
        aria-roledescription="carrusel"
    >
        <!-- La imagen entera es un enlace al archivo original, sin recortes. -->
        <a
            id="enlace-imagen"
            class="cartelera__imagen-enlace"
            href="#"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Abrir esta imagen en su resolución original"
            hidden
        >
            <img id="foto" class="cartelera__foto" alt="">
        </a>

        <!-- Solo aparece cuando no existe ninguna imagen en la carpeta. -->
        <p id="estado-vacio" class="cartelera__vacio" role="status">
            NO HAY NOTICIAS
        </p>

        <!-- Controles discretos FUERA de la imagen. -->
        <footer id="pie" class="cartelera__pie" hidden>
            <a
                id="abrir-original"
                class="cartelera__abrir-original"
                href="#"
                target="_blank"
                rel="noopener noreferrer"
            >
                Ver imagen original ↗
            </a>

            <nav id="controles" class="cartelera__controles" aria-label="Navegar por las imágenes" hidden>
                <div class="cartelera__botonera">
                    <button id="anterior" class="cartelera__boton" type="button" aria-label="Imagen anterior">‹</button>
                    <button id="siguiente" class="cartelera__boton" type="button" aria-label="Imagen siguiente">›</button>
                    <button id="pausa" class="cartelera__boton" type="button" aria-label="Pausar carrusel">❚❚</button>
                </div>
                <div id="paginacion" class="cartelera__paginacion" aria-label="Elegir imagen"></div>
                <span id="contador" class="cartelera__contador" aria-live="off"></span>
            </nav>
        </footer>
    </main>

    <script>
        /* ------------------------------------------------------------
           CONTROL DE IMÁGENES DESDE LA CARPETA (sin minificar).
           - Sin dashboard, base de datos, ni archivos extra de noticias.
           - Actualiza la carpeta cada 20 segundos.
           - Al hacer clic en la imagen, se abre su URL original.
           - Envía la altura real al micrositio para evitar scroll.
           ------------------------------------------------------------ */

        'use strict';

        const TIEMPO_DIAPOSITIVA = 6500;
        const TIEMPO_REVISION_CARPETA = 20000;
        const movimientoReducido = window.matchMedia('(prefers-reduced-motion: reduce)');

        const cartelera = document.getElementById('cartelera');
        const foto = document.getElementById('foto');
        const enlaceImagen = document.getElementById('enlace-imagen');
        const abrirOriginal = document.getElementById('abrir-original');
        const estadoVacio = document.getElementById('estado-vacio');
        const pie = document.getElementById('pie');
        const controles = document.getElementById('controles');
        const anterior = document.getElementById('anterior');
        const siguiente = document.getElementById('siguiente');
        const pausa = document.getElementById('pausa');
        const paginacion = document.getElementById('paginacion');
        const contador = document.getElementById('contador');

        let noticias = [];
        let posicion = 0;
        let temporizador = null;
        let pausadoPorUsuario = false;
        let punteroEncima = false;
        let tieneEnfoque = false;
        let huella = '';
        let solicitudEnCurso = false;

        function comunicarAltura() {
            // Solo se utiliza para ajustar el iframe, sin cargar otras páginas.
            if (window.parent === window) {
                return;
            }

            const altura = Math.ceil(cartelera.getBoundingClientRect().height) + 2;

            window.parent.postMessage(
                {
                    type: 'sga-cartelera-altura',
                    height: altura
                },
                window.location.origin
            );
        }

        function mostrarEstadoVacio(mensaje = 'NO HAY NOTICIAS') {
            detenerRotacion();
            noticias = [];
            posicion = 0;
            cartelera.classList.remove('cartelera--vertical');
            enlaceImagen.hidden = true;
            enlaceImagen.removeAttribute('href');
            foto.classList.remove('cartelera__foto--visible');
            foto.removeAttribute('src');
            pie.hidden = true;
            controles.hidden = true;
            paginacion.replaceChildren();
            estadoVacio.textContent = mensaje;
            estadoVacio.hidden = false;
            comunicarAltura();
        }

        function actualizarControles() {
            controles.hidden = noticias.length <= 1;
            paginacion.replaceChildren();
            contador.textContent = `${posicion + 1} / ${noticias.length}`;

            noticias.forEach((noticia, indice) => {
                const punto = document.createElement('button');
                punto.className = 'cartelera__punto';
                punto.type = 'button';
                punto.setAttribute('aria-label', `Mostrar imagen ${indice + 1}`);
                punto.setAttribute('aria-current', String(indice === posicion));
                punto.addEventListener('click', () => mostrarNoticia(indice));
                paginacion.appendChild(punto);
            });

            pausa.textContent = pausadoPorUsuario ? '▶' : '❚❚';
            pausa.setAttribute(
                'aria-label',
                pausadoPorUsuario ? 'Reanudar carrusel' : 'Pausar carrusel'
            );
        }

        function mostrarNoticia(indice) {
            if (noticias.length === 0) {
                mostrarEstadoVacio();
                return;
            }

            posicion = (indice + noticias.length) % noticias.length;
            const noticia = noticias[posicion];
            const esVertical = noticia.alto > noticia.ancho;

            cartelera.classList.toggle('cartelera--vertical', esVertical);
            enlaceImagen.href = noticia.src;
            abrirOriginal.href = noticia.src;
            foto.alt = noticia.titulo;

            // Primero configuramos onload/onerror para evitar perder eventos
            // cuando una fotografía ya está en la caché del navegador.
            foto.classList.remove('cartelera__foto--visible');
            foto.onload = () => {
                foto.classList.add('cartelera__foto--visible');
                comunicarAltura();
            };
            foto.onerror = () => {
                foto.classList.remove('cartelera__foto--visible');
                revisarCarpeta();
            };

            foto.src = noticia.src;
            enlaceImagen.hidden = false;
            estadoVacio.hidden = true;
            pie.hidden = false;

            actualizarControles();
            reiniciarRotacion();
            comunicarAltura();
        }

        function detenerRotacion() {
            if (temporizador !== null) {
                clearInterval(temporizador);
                temporizador = null;
            }
        }

        function reiniciarRotacion() {
            detenerRotacion();

            if (
                noticias.length < 2 ||
                pausadoPorUsuario ||
                punteroEncima ||
                tieneEnfoque ||
                document.hidden ||
                movimientoReducido.matches
            ) {
                return;
            }

            temporizador = window.setInterval(() => {
                mostrarNoticia(posicion + 1);
            }, TIEMPO_DIAPOSITIVA);
        }

        async function revisarCarpeta() {
            if (solicitudEnCurso) {
                return;
            }

            solicitudEnCurso = true;

            try {
                const respuesta = await fetch('./datos.json', {
                    cache: 'no-store'
                });

                if (!respuesta.ok) {
                    throw new Error(`Error HTTP ${respuesta.status}`);
                }

                const resultado = await respuesta.json();

                if (!Array.isArray(resultado.imagenes)) {
                    throw new Error('Respuesta inesperada del servidor');
                }

                const nuevasNoticias = resultado.imagenes.filter((noticia) => {
                    return typeof noticia.src === 'string' &&
                        typeof noticia.titulo === 'string' &&
                        Number.isFinite(noticia.ancho) &&
                        Number.isFinite(noticia.alto) &&
                        noticia.ancho > 0 && noticia.alto > 0;
                });

                const nuevaHuella = JSON.stringify(nuevasNoticias);

                if (nuevaHuella === huella) {
                    return;
                }

                const imagenActual = noticias[posicion]?.src;
                huella = nuevaHuella;
                noticias = nuevasNoticias;

                if (noticias.length === 0) {
                    mostrarEstadoVacio('NO HAY NOTICIAS');
                    return;
                }

                const posicionAnterior = noticias.findIndex((noticia) => {
                    return noticia.src === imagenActual;
                });

                mostrarNoticia(posicionAnterior >= 0 ? posicionAnterior : 0);
            } catch (error) {
                if (noticias.length === 0) {
                    mostrarEstadoVacio('No fue posible cargar las noticias');
                }
                console.error('Error al consultar la cartelera:', error);
            } finally {
                solicitudEnCurso = false;
            }
        }

        anterior.addEventListener('click', () => mostrarNoticia(posicion - 1));
        siguiente.addEventListener('click', () => mostrarNoticia(posicion + 1));

        pausa.addEventListener('click', () => {
            pausadoPorUsuario = !pausadoPorUsuario;
            actualizarControles();
            reiniciarRotacion();
        });

        cartelera.addEventListener('mouseenter', () => {
            punteroEncima = true;
            reiniciarRotacion();
        });

        cartelera.addEventListener('mouseleave', () => {
            punteroEncima = false;
            reiniciarRotacion();
        });

        cartelera.addEventListener('focusin', () => {
            tieneEnfoque = true;
            reiniciarRotacion();
        });

        cartelera.addEventListener('focusout', (evento) => {
            if (!cartelera.contains(evento.relatedTarget)) {
                tieneEnfoque = false;
                reiniciarRotacion();
            }
        });

        // Sincroniza el alto del iframe durante la ampliación suave.
        // Así las imágenes verticales no quedan cortadas a mitad de transición.
        if (typeof ResizeObserver !== 'undefined') {
            const observadorAltura = new ResizeObserver(comunicarAltura);
            observadorAltura.observe(cartelera);
        }

        window.addEventListener('resize', comunicarAltura);
        window.addEventListener('load', comunicarAltura);
        document.addEventListener('visibilitychange', reiniciarRotacion);
        movimientoReducido.addEventListener('change', reiniciarRotacion);

        revisarCarpeta();
        comunicarAltura();
        window.setInterval(revisarCarpeta, TIEMPO_REVISION_CARPETA);
    </script>
</body>
</html>
